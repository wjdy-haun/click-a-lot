<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Click Core Rank</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🔥 Click Core Rank</h1>

<!-- 로그인 -->
<div id="auth">
  <input id="id" placeholder="아이디">
  <input id="pw" type="password" placeholder="비밀번호">
  <button onclick="signup()">회원가입</button>
  <button onclick="login()">로그인</button>
</div>

<!-- 게임 -->
<div id="game" style="display:none;">

  <h2 id="welcome"></h2>

  <!-- 🔵 코어 -->
  <div id="core" onclick="coreClick(event)">
    <div id="score">0</div>
  </div>

  <h3>🏆 랭킹</h3>
  <div id="ranking"></div>

</div>

<script src="script.js"></script>

</body>
</html>
